<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rezar Cantando</title>
    <meta name="description" content="Cantar y tocar es rezar. Mirá los cantos y las lecturas de la misa de hoy." />
    <!-- Sin esto, compartir el link en WhatsApp/Instagram/Facebook mostraba
         un recuadro gris vacío con solo la URL — estas etiquetas son las que
         leen esas apps (no ejecutan el JS de la página) para armar la vista
         previa. Es una sola tarjeta fija, no una por parroquia/día: como acá
         no hay build ni servidor que arme HTML por pedido, ir más lejos que
         esto (ej. una imagen con la lectura del día) pediría una función
         propia que genere la imagen al vuelo — de más para lo que hace falta
         hoy. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Rezar Cantando" />
    <meta property="og:description" content="Cantar y tocar es rezar. Mirá los cantos y las lecturas de la misa de hoy." />
    <meta property="og:image" content="https://cancionero-iglesia-qk5n.vercel.app/icons/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="stylesheet" href="./styles.css" />
    <!-- El manifest "de verdad" (con el nombre de cada parroquia y el link
         exacto ?space=...) se arma en app.js una vez que se sabe de qué
         parroquia es esta visita — ver instalarManifestDinamico(). El ícono
         de iOS no lee el manifest, así que ese sí va estático acá. -->
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <meta name="theme-color" content="#2f8a7a" />
  </head>
  <body>
    <!-- Página de solo lectura: no hay ningún formulario ni botón de edición.
         No inicia sesión en ningún momento, así que aunque alguien intentara
         forzar una escritura desde la consola del navegador, Supabase la
         rechaza del lado del servidor (ver /supabase/schema.sql). -->
    <main id="app">
      <p class="loading">Cargando...</p>
    </main>
    <script type="module" src="./app.js"></script>
  </body>
</html>
