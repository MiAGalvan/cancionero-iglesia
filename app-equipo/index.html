<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0f2220" />
    <title>Rezar Cantando — Equipo</title>
    <!-- Para que un link a esta app (ej. el que va debajo de la placa del
         Cronograma en WhatsApp) se vea como una tarjeta con ícono y
         descripción en vez de una URL pelada — WhatsApp arma esa tarjeta
         solo leyendo estas etiquetas, no hace falta nada más de nuestro
         lado. No hay forma de que sea un botón de verdad (eso solo existe
         con la API de WhatsApp Business, paga y para otro caso de uso);
         esto es lo más prolijo que se puede lograr con un link normal. -->
    <meta property="og:title" content="Rezar Cantando — Equipo" />
    <meta property="og:description" content="Armá la lista de canciones de tu misa" />
    <meta property="og:image" content="https://cancionero-iglesia.vercel.app/icons/icon-512.png" />
    <!-- Elegimos el tema (claro/oscuro) ANTES de cargar el CSS, para que la
         página no "parpadee" mostrando un tema y cambiando al otro medio
         segundo después. Va en HTML a propósito (no en main.js): un script
         module tarda más en arrancar que uno normal, y para entonces ya se
         pintó el primer cuadro con el tema equivocado. -->
    <script>
      (function () {
        var saved = localStorage.getItem('cancionero-iglesia:theme');
        var theme =
          saved === 'light' || saved === 'dark'
            ? saved
            : window.matchMedia('(prefers-color-scheme: dark)').matches
            ? 'dark'
            : 'light';
        document.documentElement.dataset.theme = theme;
      })();
    </script>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="app"></div>
    <!-- Solo se ve en el celular (ver styles.css): en tablet/desktop la
         barra superior de siempre ya tiene lugar de sobra para todo. -->
    <nav id="bottom-nav" class="bottom-nav"></nav>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
